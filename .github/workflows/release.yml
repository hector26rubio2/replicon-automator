name: Release Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'

jobs:
  # ==============================================
  # Job 1: Build Windows installer
  # ==============================================
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v(.+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '/^## \[/{if(p){exit}; if($0 ~ "## \\[" ver "\\]"){p=1; next}} p' CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "Release v$VERSION" > release_notes.txt
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Create production env file
        shell: bash
        run: |
          cat > .env.production << 'ENVEOF'
          VITE_APP_NAME=Replicon Automator
          VITE_LOG_LEVEL=warn
          VITE_ENABLE_DEVTOOLS=false
          REPLICON_LOGIN_URL=${{ secrets.REPLICON_LOGIN_URL }}
          REPLICON_TIMEOUT=45000
          REPLICON_HEADLESS=true
          REPLICON_AUTOSAVE=true
          ENVEOF

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Windows installer
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          retention-days: 1

  # ==============================================
  # Job 2: Build macOS installer
  # ==============================================
  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        id: cache-node-modules-mac
        with:
          path: node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

      - name: Install dependencies
        if: steps.cache-node-modules-mac.outputs.cache-hit != 'true'
        run: npm ci

      - name: Create production env file
        shell: bash
        run: |
          cat > .env.production << 'ENVEOF'
          VITE_APP_NAME=Replicon Automator
          VITE_LOG_LEVEL=warn
          VITE_ENABLE_DEVTOOLS=false
          REPLICON_LOGIN_URL=${{ secrets.REPLICON_LOGIN_URL }}
          REPLICON_TIMEOUT=45000
          REPLICON_HEADLESS=true
          REPLICON_AUTOSAVE=true
          ENVEOF

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package macOS installer
        run: npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.yml
          retention-days: 1

  # ==============================================
  # Job 3: Create GitHub Release
  # ==============================================
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release/

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          awk -v ver="$VERSION" '/^## \[/{if(p){exit}; if($0 ~ "## \\[" ver "\\]"){p=1; next}} p' CHANGELOG.md > release_notes.txt || true
          if [ ! -s release_notes.txt ]; then
            echo "Release v$VERSION" > release_notes.txt
          fi
          {
            echo 'notes<<NOTES_EOF'
            cat release_notes.txt
            echo NOTES_EOF
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Replicon Automator v${{ needs.build-windows.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}